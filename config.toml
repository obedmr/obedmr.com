theme = "blowfish"
baseURL = "https://obedmr.com/"
title = "Obed N Munoz"
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 24
enableEmoji = true
pluralizeListTitles = false

[pagination]
  pagerSize = 8

[imaging]
  anchor = "Center"

[taxonomies]
  author = "authors"
  tag = "tags"
  category = "categories"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[services]
  [services.googleAnalytics]
    id = "UA-51720562-1"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false

[params]
  colorScheme = "obed-blue"
  defaultAppearance = "light"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  description = "Bible studies, reflections, and technology notes by Obed N Munoz."
  mainSections = ["bible", "tech", "2017"]
  disableImageOptimization = false
  disableImageZoom = false
  hotlinkFeatureImage = true
  thumbnailAspectRatio = "1.45"
  imagePosition = "50% 50%"

  [params.header]
    layout = "fixed-fill-blur"

  [params.footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.homepage]
    layout = "custom"
    showRecent = false
    showRecentItems = 9
    showMoreLink = false
    cardView = true
    cardViewScreenWidth = false

  [params.article]
    showDate = true
    showAuthor = true
    showReadingTime = true
    showWordCount = true
    showTableOfContents = true
    showHeadingAnchors = true
    showTaxonomies = true
    showCategories = true
    showTags = true
    showPagination = true
    showZenMode = true

  [params.list]
    showSummary = true
    showCards = true
    cardView = true
    featureImageHover = true
    groupByYear = false
    constrainItemsWidth = true

  [params.taxonomy]
    showTermCount = true
    cardView = true

  [params.term]
    groupByYear = false
    cardView = true

[languages]
  [languages.en]
    disabled = false
    locale = "en"
    label = "English"
    weight = 1
    title = "Obed N Munoz"

    [languages.en.params]
      displayName = "EN"
      isoCode = "en"
      dateFormat = "January 2, 2006"
      description = "Bible studies, reflections, and technology notes by Obed N Munoz."

      [languages.en.params.author]
        name = "Obed N Munoz"
        image = "img/main/me.jpeg"
        headline = "Learn by doing, learn by teaching."
        bio = "Bible studies, reflections, and technology notes for a thoughtful life."
        links = [
          { github = "https://github.com/obedmr" },
          { gitlab = "https://gitlab.com/obedmr" },
          { linkedin = "https://linkedin.com/in/obedmr" },
          { facebook = "https://facebook.com/obedmr" },
          { twitter = "https://twitter.com/_obedmr" },
          { telegram = "https://t.me/obedmr" },
          { keybase = "https://keybase.io/obedmr" },
          { email = "mailto:obed.n.munoz@gmail.com" },
        ]

    [[languages.en.menus.main]]
      name = "Bible"
      pageRef = "bible"
      weight = 10

    [[languages.en.menus.main]]
      name = "Tech"
      pageRef = "tech"
      weight = 20

    [[languages.en.menus.main]]
      name = "Categories"
      pageRef = "categories"
      weight = 30

    [[languages.en.menus.main]]
      name = "Tags"
      pageRef = "tags"
      weight = 40

  [languages.es]
    disabled = false
    locale = "es"
    label = "Espanol"
    weight = 2
    title = "Obed N Munoz"

    [languages.es.params]
      displayName = "ES"
      isoCode = "es"
      dateFormat = "2 January 2006"
      description = "Estudios biblicos, reflexiones y notas de tecnologia por Obed N Munoz."

      [languages.es.params.author]
        name = "Obed N Munoz"
        image = "img/main/me.jpeg"
        headline = "Aprende haciendo, aprende ensenando."
        bio = "Estudios biblicos, reflexiones y notas de tecnologia para una vida pensada."
        links = [
          { github = "https://github.com/obedmr" },
          { gitlab = "https://gitlab.com/obedmr" },
          { linkedin = "https://linkedin.com/in/obedmr" },
          { facebook = "https://facebook.com/obedmr" },
          { twitter = "https://twitter.com/_obedmr" },
          { telegram = "https://t.me/obedmr" },
          { keybase = "https://keybase.io/obedmr" },
          { email = "mailto:obed.n.munoz@gmail.com" },
        ]

    [[languages.es.menus.main]]
      name = "Biblia"
      pageRef = "bible"
      weight = 10

    [[languages.es.menus.main]]
      name = "Tecnologia"
      pageRef = "tech"
      weight = 20

    [[languages.es.menus.main]]
      name = "Categorias"
      pageRef = "categories"
      weight = 30

    [[languages.es.menus.main]]
      name = "Etiquetas"
      pageRef = "tags"
      weight = 40
